name: mLobby build validation

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlobby-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout mLobby
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Verify bundled mCore library
        shell: bash
        run: |
          test -s libs/mCore.jar
          ls -lh libs/mCore.jar

      - name: Build Spigot 1.8.8 API/NMS artifacts
        uses: SpraxDev/Action-SpigotMC@v5
        with:
          versions: "1.8.8"
          generateSrc: false
          generateDoc: false

      - name: Compile and package mLobby
        run: ./gradlew --no-daemon clean build

      - name: Verify generated plugin JAR
        shell: bash
        run: |
          test -s build/libs/mLobby.jar
          ls -lh build/libs/mLobby.jar

      - name: Upload mLobby plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: mLobby-jar
          path: build/libs/mLobby.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish built JAR to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p dist
          cp build/libs/mLobby.jar dist/mLobby.jar
          sha256sum dist/mLobby.jar > dist/mLobby.jar.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/mLobby.jar dist/mLobby.jar.sha256
          if git diff --cached --quiet; then
            echo "No JAR changes to publish."
            exit 0
          fi
          git commit -m "build: publish mLobby.jar [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
