name: mLobby build validation

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlobby-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout mLobby
        uses: actions/checkout@v4

      - name: Require access to the private mCore repository
        shell: bash
        env:
          MCORE_REPO_TOKEN: ${{ secrets.MCORE_REPO_TOKEN }}
        run: |
          if [ -z "$MCORE_REPO_TOKEN" ]; then
            echo "::error::Configure the MCORE_REPO_TOKEN repository secret with read access to alexvoliveira/mCore."
            exit 1
          fi

      - name: Checkout the compatible mCore source
        uses: actions/checkout@v4
        with:
          repository: alexvoliveira/mCore
          ref: 709d3e988b1932f056ab12b9087d10e9a590e565
          path: mCore
          token: ${{ secrets.MCORE_REPO_TOKEN }}

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Build Spigot 1.8.8 API/NMS artifacts
        uses: SpraxDev/Action-SpigotMC@v5
        with:
          versions: "1.8.8"
          generateSrc: false
          generateDoc: false

      - name: Build mCore dependency
        working-directory: mCore
        run: ./gradlew --no-daemon clean build

      - name: Compile and package mLobby
        env:
          MCORE_JAR: ${{ github.workspace }}/mCore/build/libs/mCore.jar
        run: ./gradlew --no-daemon clean build

      - name: Verify generated plugin JAR
        shell: bash
        run: |
          test -s build/libs/mLobby.jar
          ls -lh build/libs/mLobby.jar

      - name: Upload mLobby plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: mLobby-jar
          path: build/libs/mLobby.jar
          if-no-files-found: error
          retention-days: 14
